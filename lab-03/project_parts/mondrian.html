<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Завдання 2: Мондріан</title>
  <style type="text/css">
    table { border-collapse: collapse; width: 400px; }
    td { border: 5px solid #000; }
    tr { width: 60px; height: 60px; }
  </style>
</head>
<body>
  <div align="center">
    <h1>Завдання 2</h1>
    <!-- Сітка 6 стовпців x 7 рядків -->
    <table align="center">
      <!-- рядок 1 -->
      <tr>
        <td bgcolor="#ffffff" colspan="2"><br/></td>
        <td bgcolor="#ffffff" colspan="2"><br/></td>
        <td bgcolor="#fffa69" colspan="2"><br/></td>
      </tr>
      <!-- рядок 2 -->
      <tr>
        <td bgcolor="#ffffff"><br/></td>
        <td bgcolor="#ff5b2d" colspan="3" rowspan="2"><br/></td>
        <td bgcolor="#fffa69" colspan="2"><br/></td>
      </tr>
      <!-- рядок 3 -->
      <tr>
        <td bgcolor="#ffffff" rowspan="2"><br/></td>
        <td bgcolor="#ffffff"><br/></td>
        <td bgcolor="#ffffff"><br/></td>
      </tr>
      <!-- рядок 4 -->
      <tr>
        <td bgcolor="#000000" colspan="2" rowspan="2"><br/></td>
        <td bgcolor="#ffffff"><br/></td>
        <td bgcolor="#ffffff" colspan="2"><br/></td>
      </tr>
      <!-- рядок 5 -->
      <tr>
        <td bgcolor="#fffa69" rowspan="3"><br/></td>
        <td bgcolor="#ffffff"><br/></td>
        <td bgcolor="#074481" colspan="2" rowspan="2"><br/></td>
      </tr>
      <!-- рядок 6 -->
      <tr>
        <td bgcolor="#ffffff" colspan="2" rowspan="2"><br/></td>
        <td bgcolor="#000000"><br/></td>
      </tr>
      <!-- рядок 7 -->
      <tr>
        <td bgcolor="#ffffff"><br/></td>
        <td bgcolor="#ffffff" colspan="2"><br/></td>
      </tr>
    </table>
    <p><a href="../index.html">Повернутись на головну</a></p>
  </div>
</body>
</html>
