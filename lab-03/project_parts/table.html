<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Завдання 1: таблиця</title>
  <style type="text/css">
    table { border-collapse: collapse; width: 400px; }
    td { border: 2px solid #000; width: 50px; height: 50px; }
    tr { height: 50px; }
  </style>
</head>
<body>
  <div align="center">
    <h1>Завдання 1</h1>
    <table align="center">
      <tr>
        <td bgcolor="#2effd0" colspan="8"><br/></td>
      </tr>
      <tr>
        <td bgcolor="#ffffd0" rowspan="6"><br/></td>
        <td bgcolor="#2effd0" colspan="6"><br/></td>
        <td bgcolor="#ffffd0" rowspan="6"><br/></td>
      </tr>
      <tr>
        <td bgcolor="#ffffd0" rowspan="4"><br/></td>
        <td bgcolor="#2effd0" colspan="4"><br/></td>
        <td bgcolor="#ffffd0" rowspan="4"><br/></td>
      </tr>
      <tr>
        <td bgcolor="#ffffd0" rowspan="2"><br/></td>
        <td bgcolor="#ff0f1f"><br/></td>
        <td bgcolor="#0f1fff"><br/></td>
        <td bgcolor="#ffffd0" rowspan="2"><br/></td>
      </tr>
      <tr>
        <td bgcolor="#2fff2f"><br/></td>
        <td bgcolor="#ffff3f"><br/></td>
      </tr>
      <tr>
        <td bgcolor="#2effd0" colspan="4"><br/></td>
      </tr>
      <tr>
        <td bgcolor="#2effd0" colspan="6"><br/></td>
      </tr>
      <tr>
        <td bgcolor="#2effd0" colspan="8"><br/></td>
      </tr>
    </table>
    <p><a href="../index.html">Повернутись на головну</a></p>
  </div>
</body>
</html>
