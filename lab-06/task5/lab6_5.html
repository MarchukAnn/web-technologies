<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 5 лаби 6</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather">
        <div class="card">
            <span class="card-city">Сьогодні, хмарно</span>
            <span class="card-temp">17</span>
        </div>
        <img class="cloud" src="cloud.png" alt="Хмара">
        <div class="arrows">
            <button class="arrow" type="button" aria-label="Назад"><</button>
            <button class="arrow" type="button" aria-label="Вперед">></button>
        </div>
        <ul class="forecast">
            <li class="forecast-item">
                <span class="forecast-day">Mon</span>
                <span class="forecast-temp">17°</span>
            </li>
            <li class="forecast-item">
                <span class="forecast-day">Tue</span>
                <span class="forecast-temp">19°</span>
            </li>
            <li class="forecast-item">
                <span class="forecast-day">Wed</span>
                <span class="forecast-temp">16°</span>
            </li>
            <li class="forecast-item">
                <span class="forecast-day">Thu</span>
                <span class="forecast-temp">18°</span>
            </li>
            <li class="forecast-item">
                <span class="forecast-day">Fri</span>
                <span class="forecast-temp">21°</span>
            </li>
        </ul>
    </div>
</body>
</html>
